<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeRoom Preview Sandbox</title>
  </head>
  <body>
    <script>
      addEventListener(
        'message',
        (event) => {
          if (event.source !== parent) return
          const message = event.data
          if (
            !message ||
            message.marker !== 'typeroom-preview-host' ||
            message.type !== 'render' ||
            typeof message.sourceDocument !== 'string'
          )
            return

          document.open()
          document.write(message.sourceDocument)
          document.close()
        },
        { once: true },
      )
    </script>
  </body>
</html>
